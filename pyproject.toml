[project]
name = "icemaint"
version = "0.2.0"
description = "CLI de maintenance des tables Iceberg (Polaris) et client Teradata (chargement vers Iceberg)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "typer>=0.21.1",
    # Doit rester aligné sur le jar iceberg-spark-runtime-4.1 du Dockerfile (Iceberg 1.12.0)
    "pyspark>=4.1.4,<4.2",
    # Driver Teradata pur Python (wheel py3-none-any), sans JVM
    "teradatasql>=20.0.0.0,<21",
]

[project.scripts]
icemaint = "icemaint.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
